name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Build Go packages
        run: go build -v ./...

      - name: Build signed app bundle
        run: ./scripts/build-app-bundle.sh

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Focusbar-app-bundle
          path: dist/Focusbar.app
