name: Build And Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Verify dependencies
        run: go mod download

      - name: Test
        run: go test -v ./...

      - name: Build
        run: go build -v ./...

  package:
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build app bundle
        run: ./scripts/build-app-bundle.sh

      - name: Build zip release
        run: ./scripts/package-release.sh

      - name: Build DMG release
        run: ./scripts/package-dmg.sh

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Focusbar-app-bundle
          path: dist/Focusbar.app

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Focusbar-zip
          path: dist/Focusbar-macOS.zip

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Focusbar-dmg
          path: dist/Focusbar.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build zip release
        run: ./scripts/package-release.sh

      - name: Build DMG release
        run: ./scripts/package-dmg.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Focusbar-macOS.zip
            dist/Focusbar.dmg
